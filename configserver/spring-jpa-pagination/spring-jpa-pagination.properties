spring.application.name=spring-jpa-pagination
app.message = ::::  Local System Environment ========= ::::
server.port=9090


# Eureka Server URL
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Enable service registration
eureka.client.register-with-eureka=true

# Enable service discovery
eureka.client.fetch-registry=true

# Instance ID
eureka.instance.instance-id=${spring.application.name}:${server.port}



spring.config.import=classpath:redis.properties, classpath:actuator.properties
spring.profiles.active=dev

#database
spring.datasource.url=jdbc:postgresql://localhost:5432/kafka
spring.datasource.username=postgres
spring.datasource.password=irfan@123
spring.datasource.driver-class-name=org.postgresql.Driver

#hibernate configuration
spring.jpa.hibernate.ddl-auto=validate	
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

